<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oriberry Ordering</title>
    <!-- Google Fonts: Serif thanh lịch giống trang /shop -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandCream: '#faf8f5',
                        brandDark: '#1a1a1a',
                        brandAccent: '#d97706'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #faf8f5;
            color: #1a1a1a;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }
        /* Sidebar ẩn thông minh, trượt ra với độ trong suốt 50% */
        #category-sidebar {
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            background-color: rgba(250, 248, 245, 0.9);
            backdrop-filter: blur(8px);
        }
        #category-sidebar.open {
            transform: translateX(0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header tối giản -->
    <header class="w-full px-4 py-4 flex items-center justify-between border-b border-stone-200 bg-[#faf8f5]">
        <!-- Logo sát lề trái -->
        <h1 class="font-serif-custom text-2xl font-bold tracking-wider text-stone-900 m-0">ORIBERRY</h1>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- Cột danh mục ẩn (50% translucent, trượt ra khi bấm nút) -->
        <aside id="category-sidebar" class="absolute top-0 bottom-0 left-0 w-64 z-50 p-4 border-r border-stone-200 shadow-lg flex flex-col space-y-4">
            <div class="flex items-center justify-between mb-2">
                <span class="font-serif-custom font-semibold text-stone-800 text-lg">Danh mục</span>
                <button onclick="toggleSidebar()" class="text-stone-600 p-1 text-xl font-bold">&times;</button>
            </div>
            <nav class="flex flex-col space-y-3 font-sans text-stone-700">
                <a href="#coffee" onclick="toggleSidebar()" class="py-2 px-3 rounded hover:bg-stone-200/50 transition">Coffee</a>
                <a href="#tea" onclick="toggleSidebar()" class="py-2 px-3 rounded hover:bg-stone-200/50 transition">Tea</a>
                <a href="#juices" onclick="toggleSidebar()" class="py-2 px-3 rounded hover:bg-stone-200/50 transition">Juices</a>
                <a href="#smoothies" onclick="toggleSidebar()" class="py-2 px-3 rounded hover:bg-stone-200/50 transition">Smoothies</a>
                <a href="#cake" onclick="toggleSidebar()" class="py-2 px-3 rounded hover:bg-stone-200/50 transition">Cake</a>
                <a href="#banh-mi" onclick="toggleSidebar()" class="py-2 px-3 rounded hover:bg-stone-200/50 transition">Bánh Mì</a>
                <a href="#spaghetti" onclick="toggleSidebar()" class="py-2 px-3 rounded hover:bg-stone-200/50 transition">Spaghetti</a>
            </nav>
        </aside>

        <!-- Phần hiển thị danh mục và món ăn (chiếm trọn màn hình) -->
        <main class="flex-1 px-4 py-4 overflow-y-auto">
            
            <!-- Hàng chứa nút 3 gạch và Tiêu đề nhóm món -->
            <div class="flex items-center space-x-4 mb-6">
                <!-- Nút 3 gạch xổ menu -->
                <button onclick="toggleSidebar()" class="p-2 text-stone-800 hover:bg-stone-200/60 rounded-lg transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <!-- Tiêu đề nhóm món được đẩy dịch sang phải một chút -->
                <h2 id="coffee" class="font-serif-custom text-2xl font-bold text-stone-900 tracking-wide">Coffee</h2>
            </div>

            <!-- Danh sách các món ăn/đồ uống (Card to rộng, không có dấu cộng thừa) -->
            <div class="space-y-4">
                
                <!-- Món 1 -->
                <div class="bg-white border border-stone-200 rounded-2xl p-4 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-stone-400 transition">
                    <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=300" alt="Airy-cano Classic" class="w-20 h-20 object-cover rounded-xl flex-shrink-0">
                    <div class="flex-1">
                        <h3 class="font-serif-custom font-bold text-lg text-stone-900">Airy-cano Classic</h3>
                        <p class="text-sm text-stone-500 font-sans mt-1 line-clamp-2">Hương vị Americano nguyên bản nâng tầm đậm đà.</p>
                    </div>
                </div>

                <!-- Món 2 -->
                <div class="bg-white border border-stone-200 rounded-2xl p-4 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-stone-400 transition">
                    <img src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=300" alt="Airy-cano Yuzu" class="w-20 h-20 object-cover rounded-xl flex-shrink-0">
                    <div class="flex-1">
                        <h3 class="font-serif-custom font-bold text-lg text-stone-900">Airy-cano Yuzu</h3>
                        <p class="text-sm text-stone-500 font-sans mt-1 line-clamp-2">Kết hợp espresso và hương cam Yuzu thanh mát.</p>
                    </div>
                </div>

                <!-- Món 3 -->
                <div class="bg-white border border-stone-200 rounded-2xl p-4 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-stone-400 transition">
                    <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=300" alt="Specialty Coffee Đá" class="w-20 h-20 object-cover rounded-xl flex-shrink-0">
                    <div class="flex-1">
                        <h3 class="font-serif-custom font-bold text-lg text-stone-900">Specialty Coffee Đá</h3>
                        <p class="text-sm text-stone-500 font-sans mt-1 line-clamp-2">Pha thủ công V60 chiết xuất hương vị hạt Arabica đặc sắc.</p>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('category-sidebar');
            sidebar.classList.toggle('open');
        }
    </script>
</body>
</html>
