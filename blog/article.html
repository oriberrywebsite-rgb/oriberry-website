<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bài viết | Oriberry Journal</title>
  <!-- Giữ link bài cũ; replace tránh thêm trang chuyển tiếp vào lịch sử. -->
  <script id="blog-redirect">
    const target = new URL('/blog/', location.href);
    target.search = location.search;
    target.hash = location.hash;
    // Link cũ thiếu slug vẫn báo thiếu bài, không trở thành danh sách.
    if (!target.searchParams.has('slug')) target.searchParams.set('slug', '');
    location.replace(target.href);
  </script>
</head>
<body>
  <p>Đang chuyển đến bài viết…</p>
  <noscript>Bạn cần bật JavaScript để đọc bài viết.</noscript>
</body>
</html>
