<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Câu chuyện kinh doanh, nông dân và chế biến cà phê của Oriberry.">
  <title>Oriberry Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS: giao diện chung, danh sách, bài viết và màn hình nhỏ. -->
  <style id="blog-styles">
    :root {
      color-scheme: light; font-family: Inter,Arial,sans-serif; color: #231b16;
      background: #f6f2ea;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    a {
      color: inherit;
    }
    button {
      font: inherit;
    }
    header {
      border-bottom: 1px solid #ded4c5; background: #faf7f1;
    }
    .shell {
      max-width: 1120px; margin: auto; padding: 0 24px;
    }
    .topbar {
      min-height: 76px; display: flex; align-items: center;
      justify-content: space-between; gap: 20px;
    }
    .brand {
      font-family: Newsreader,Georgia,serif; font-size: 30px; text-decoration: none;
      letter-spacing: .02em;
    }
    .topbar nav {
      display: flex; gap: 18px; font-size: 14px;
    }
    .topbar nav a {
      text-decoration: none;
    }
    .topbar nav a:hover,.category-nav a:hover {
      text-decoration: underline;
    }
    .hero {
      padding: 68px 0 40px;
    }
    .eyebrow {
      text-transform: uppercase; letter-spacing: .18em; color: #88633c;
      font-size: 12px; font-weight: 700;
    }
    .hero h1 {
      font-family: Newsreader,Georgia,serif; font-size: clamp(42px,7vw,76px); font-weight: 400;
      margin: 8px 0 12px;
    }
    .hero p {
      max-width: 640px; line-height: 1.7; color: #685e55;
    }
    .category-nav {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin: 12px 0 32px;
    }
    .category-nav a {
      text-decoration: none; border: 1px solid #cdbba6; border-radius: 999px;
      padding: 11px 18px; font-size: 13px; font-weight: 600;
    }
    .category-nav a[aria-current=page] {
      background: #3b2a20; color: #fff; border-color: #3b2a20;
    }
    .post-grid {
      display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 22px;
      min-height: 190px;
    }
    .post-card {
      background: #fff; border: 1px solid #e4dacd; border-radius: 20px;
      overflow: hidden; box-shadow: 0 8px 24px #3927150a;
    }
    .post-card a {
      text-decoration: none; display: block; height: 100%;
    }
    .post-card img {
      width: 100%; aspect-ratio: 3/2; object-fit: cover;
      background: #e4dacd;
    }
    .post-card-content {
      padding: 20px;
    }
    .post-card h2 {
      font: 400 27px/1.12 Newsreader,Georgia,serif; margin: 0 0 10px;
    }
    .post-card p {
      font-size: 14px; line-height: 1.55; color: #66594f;
      margin: 0;
    }
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 36px 0 72px;
    }
    .pagination a,.pagination span {
      min-width: 38px; text-align: center; padding: 10px 14px;
      border: 1px solid #cdbba6; border-radius: 10px; text-decoration: none;
      font-size: 13px;
    }
    .pagination .current {
      background: #3b2a20; color: #fff; border-color: #3b2a20;
    }
    .pagination .disabled {
      opacity: .4;
    }
    .state {
      grid-column: 1/-1; padding: 44px 20px; background: #fff;
      border: 1px solid #e4dacd; border-radius: 18px; text-align: center;
      color: #65594e; line-height: 1.6;
    }
    .article {
      max-width: 780px; margin: auto; padding: 58px 24px 90px;
    }
    .article .back {
      font-size: 13px; color: #76583a; text-decoration: none;
    }
    .article h1 {
      font: 400 clamp(40px,7vw,70px)/1.07 Newsreader,Georgia,serif; margin: 25px 0 14px;
    }
    .article .intro {
      font-size: 19px; line-height: 1.65; color: #675b50;
    }
    .article .cover {
      width: 100%; border-radius: 18px; aspect-ratio: 16/9;
      object-fit: cover; margin: 28px 0;
    }
    .article-content {
      font-size: 17px; line-height: 1.85;
    }
    .article-content h2 {
      font: 400 34px Newsreader,Georgia,serif; margin: 36px 0 12px;
    }
    .article-content h3 {
      font: 500 24px Newsreader,Georgia,serif; margin: 28px 0 10px;
    }
    .article-content img {
      max-width: 100%; height: auto; border-radius: 14px;
      margin: 20px 0;
    }
    .article-content li {
      margin: 6px 0;
    }
    .article-content p {
      margin: 0 0 18px;
    }
    footer {
      border-top: 1px solid #ded4c5; padding: 32px 0; color: #76675b;
      font-size: 13px;
    }
    @media(max-width:850px) {
      .post-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
      }
    }
    @media(max-width:620px) {
      .shell {
        padding: 0 16px;
      }
      .topbar {
        min-height: 65px;
      }
      .topbar nav {
        gap: 12px; font-size: 12px;
      }
      .brand {
        font-size: 25px;
      }
      .hero {
        padding: 42px 0 24px;
      }
      .post-grid {
        grid-template-columns: 1fr;
      }
      .article {
        padding: 38px 16px 65px;
      }
    }
  </style>
</head>
<body>
  <!-- HTML: chỉ hiện danh sách hoặc bài viết tùy URL. -->
  <header>
    <div class="shell topbar">
      <a class="brand" href="/">Oriberry</a>
      <nav aria-label="Điều hướng chính">
        <a href="/">Trang chủ</a>
        <a href="/order/">Menu</a>
        <a href="/shop/">Shop</a>
      </nav>
    </div>
  </header>

  <main id="blogList" class="shell" hidden>
    <section class="hero">
      <div class="eyebrow">Oriberry Journal</div>
      <h1 id="categoryTitle">Stories</h1>
      <p>Câu chuyện từ nông trại, cách chúng tôi làm việc và hành trình của từng hạt cà phê.</p>
    </section>
    <nav id="categoryNav" class="category-nav" aria-label="Chuyên mục"></nav>
    <section id="postGrid" class="post-grid" aria-live="polite">
      <div class="state">Đang tải bài viết…</div>
    </section>
    <nav id="pagination" class="pagination" aria-label="Trang bài viết"></nav>
  </main>

  <main id="blogArticle" class="article" hidden>
    <a id="backToCategory" class="back" href="/blog/">← Danh sách bài viết</a>
    <div id="articleCategory" class="eyebrow" style="margin-top:34px"></div>
    <h1 id="articleTitle">Oriberry Journal</h1>
    <p id="articleExcerpt" class="intro"></p>
    <img id="articleCover" class="cover" alt="" hidden>
    <div id="articleBody" class="article-content" aria-live="polite">
      <div class="state">Đang tải bài viết…</div>
    </div>
  </main>

  <footer>
    <div class="shell">© Oriberry Coffee · <a href="/">Về trang chủ</a></div>
  </footer>

  <script id="blog-script">
    // Cấu hình: nội dung vẫn lấy từ Google Sheets qua API hiện có.
    const BLOG_API_URL = 'https://script.google.com/macros/s/AKfycbx6HqvTfvToQnn61_8d2dtIIf57SlKvL_-XCi32O-HVWWCIwlQ6f9kvbas04guhiGt-/exec';
    const BLOG_CATEGORIES = { business: 'The Business', farmers: 'The Farmers', processing: 'The Processing' };
    const blogParams = new URLSearchParams(location.search);
    const blogCategory = Object.hasOwn(BLOG_CATEGORIES, blogParams.get('category')) ? blogParams.get('category') : 'farmers';

    function blogListUrl(category, page = 1) {
      return `/blog/?category=${encodeURIComponent(category)}&page=${page}`;
    }

    function blogArticleUrl(category, slug) {
      return `/blog/?category=${encodeURIComponent(category)}&slug=${encodeURIComponent(slug)}`;
    }

    // Dùng chung khi tạo phần tử văn bản; nội dung Sheet không được thực thi như HTML.
    function textNode(tag, text, className = '') {
      const node = document.createElement(tag);
      node.textContent = text;
      node.className = className;
      return node;
    }

    function imageUrl(value) {
      return /^https:\/\/[^\s"'<>]+$/i.test(String(value || '')) ? value : '';
    }

    async function blogFetch(action, params) {
      const url = new URL(BLOG_API_URL);
      url.searchParams.set('action', action);
      Object.entries(params).forEach(([key, value]) => url.searchParams.set(key, value));
      const cacheKey = `oriberry_blog_v1:${url.search}`;
      try {
        const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
        if (cached && Date.now() - cached.savedAt < 120000) return cached.data;
      } catch (_) { /* Cache không bắt buộc. */ }
      const response = await fetch(url.toString());
      if (!response.ok) throw new Error('Không thể kết nối máy chủ.');
      const data = await response.json();
      if (data.status !== 'success') throw new Error(data.message || 'Không tải được bài viết.');
      try {
        sessionStorage.setItem(cacheKey, JSON.stringify({ savedAt: Date.now(), data }));
      } catch (_) { /* Trình duyệt vẫn đọc được bài khi chặn storage. */ }
      return data;
    }

    // Hiển thị danh sách và phân trang từ kết quả API, không gọi mạng ở đây.
    function renderBlogList(data) {
      const grid = document.getElementById('postGrid');
      grid.replaceChildren();
      if (!data.posts.length) {
        grid.append(textNode('div', data.total
          ? 'Trang này chưa có bài viết.'
          : 'Chuyên mục này chưa có bài viết được xuất bản.', 'state'));
      }
      for (const post of data.posts) {
        const card = document.createElement('article');
        card.className = 'post-card';
        const link = document.createElement('a');
        link.href = blogArticleUrl(blogCategory, post.slug);
        const img = document.createElement('img');
        img.src = imageUrl(post.coverImageUrl);
        img.alt = post.title;
        img.loading = 'lazy';
        const body = document.createElement('div');
        body.className = 'post-card-content';
        body.append(textNode('h2', post.title), textNode('p', post.excerpt));
        link.append(img, body);
        card.append(link);
        grid.append(card);
      }
      const nav = document.getElementById('pagination');
      nav.replaceChildren();
      if (data.pages < 2) return;
      const addPage = (label, page, current = false) => {
        const node = textNode(page ? 'a' : 'span', label);
        if (page) node.href = blogListUrl(blogCategory, page);
        else node.className = current ? 'current' : 'disabled';
        if (current) node.setAttribute('aria-current', 'page');
        nav.append(node);
      };
      addPage('Previous', data.page > 1 ? data.page - 1 : null);
      for (let page = 1; page <= data.pages; page++) {
        addPage(String(page), page === data.page ? null : page, page === data.page);
      }
      addPage('Next', data.page < data.pages ? data.page + 1 : null);
    }

    // Định dạng nội dung Sheet: đoạn văn, tiêu đề, danh sách và ảnh HTTPS.
    function renderArticleContent(container, source) {
      container.replaceChildren();
      let list = null;
      for (const raw of String(source || '').split(/\r?\n/)) {
        const line = raw.trim();
        if (!line) { list = null; continue; }
        if (line.startsWith('- ')) {
          if (!list) {
            list = document.createElement('ul');
            container.append(list);
          }
          list.append(textNode('li', line.slice(2)));
          continue;
        }
        list = null;
        const image = /^!\[([^\]]*)\]\((https:\/\/[^\s"'<>]+)\)$/.exec(line);
        if (image) {
          const img = document.createElement('img');
          img.src = imageUrl(image[2]);
          img.alt = image[1];
          img.loading = 'lazy';
          container.append(img);
        } else {
          const heading = /^(#{2,3}) (.*)$/.exec(line);
          container.append(textNode(heading ? `h${heading[1].length}` : 'p', heading ? heading[2] : line));
        }
      }
    }

    function renderBlogArticle(post) {
      document.getElementById('articleCategory').textContent = BLOG_CATEGORIES[blogCategory];
      document.getElementById('articleTitle').textContent = post.title;
      document.getElementById('articleExcerpt').textContent = post.excerpt;
      document.title = `${post.title} | Oriberry Journal`;
      document.querySelector('meta[name="description"]').content = post.excerpt;
      const cover = document.getElementById('articleCover');
      cover.src = imageUrl(post.coverImageUrl);
      cover.alt = post.title;
      cover.hidden = !cover.src;
      renderArticleContent(document.getElementById('articleBody'), post.content);
    }

    // Luồng chính: đọc URL → lấy dữ liệu Sheet một lần → hiển thị danh sách hoặc bài.
    async function initBlog() {
      const isArticle = blogParams.has('slug');
      document.getElementById('blogList').hidden = isArticle;
      document.getElementById('blogArticle').hidden = !isArticle;
      const title = BLOG_CATEGORIES[blogCategory];
      const content = document.getElementById(isArticle ? 'articleBody' : 'postGrid');
      if (isArticle) {
        document.title = 'Bài viết | Oriberry Journal';
        document.querySelector('meta[name="description"]').content = 'Bài viết từ Oriberry Journal.';
        const back = document.getElementById('backToCategory');
        back.href = blogListUrl(blogCategory);
        back.textContent = `← ${title}`;
        if (!blogParams.get('slug')) {
          content.replaceChildren(textNode('div', 'Thiếu đường dẫn bài viết.', 'state'));
          return;
        }
      } else {
        document.title = `${title} | Oriberry Journal`;
        document.getElementById('categoryTitle').textContent = title;
        const nav = document.getElementById('categoryNav');
        nav.replaceChildren();
        for (const [id, name] of Object.entries(BLOG_CATEGORIES)) {
          const link = textNode('a', name);
          link.href = blogListUrl(id);
          if (id === blogCategory) link.setAttribute('aria-current', 'page');
          nav.append(link);
        }
      }
      const rawPage = Number(blogParams.get('page') || 1);
      const params = isArticle
        ? { category: blogCategory, slug: blogParams.get('slug') }
        : { category: blogCategory, page: Number.isInteger(rawPage) && rawPage > 0 ? rawPage : 1 };
      try {
        const data = await blogFetch(isArticle ? 'getBlogPost' : 'getBlogPosts', params);
        if (isArticle) renderBlogArticle(data.post);
        else renderBlogList(data);
      } catch (error) {
        content.replaceChildren(textNode('div', error.message || (isArticle
          ? 'Không tìm thấy bài viết.' : 'Không thể tải bài viết. Vui lòng thử lại.'), 'state'));
      }
    }

    initBlog();
  </script>
</body>
</html>
