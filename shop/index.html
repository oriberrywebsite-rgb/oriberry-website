  <!-- Script logic with Caching & Query Params -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWopdIwcIH1mI6i0LNZP3YLK_U7zjIc6iMwLEdyCNuZ4L4jAwop8QWc6g0v06Qs_f/exec";
    const CACHE_KEY = "oriberry_products_cache_v1";
    const CACHE_TIME_KEY = "oriberry_products_time_v1";

    const GRIND_OPTIONS = [
      "Whole grain", "Drip/V60 powder", "Coldbrew powder", 
      "Espresso powder", "Staresso powder", "Aeropress powder", 
      "Frenchpress Powder/Phin", "Moka powder"
    ];

    let PRODUCTS = [];
    let activeProductForPop = null;
    let selectedPopGrind = GRIND_OPTIONS[0];
    let selectedPopQty = 1;
    let cart = JSON.parse(localStorage.getItem('oriberry_cart') || '[]');

    // Hàm chuẩn hóa chuỗi tiếng Việt để so sánh bộ lọc chính xác
    function normalizeStr(str) {
      if (!str) return '';
      return str.toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d").replace(/Đ/g, "d")
        .trim();
    }

    async function fetchProducts() {
      const cachedData = localStorage.getItem(CACHE_KEY);

      // 1. Render ngay lập tức từ Cache nếu có
      if (cachedData) {
        try {
          PRODUCTS = JSON.parse(cachedData);
          renderProducts();
          checkUrlForProduct();
        } catch (e) {
          console.error("Lỗi đọc cache:", e);
        }
      }

      // 2. Fetch ngầm dữ liệu mới nhất từ Google Apps Script
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          PRODUCTS = data;
          localStorage.setItem(CACHE_KEY, JSON.stringify(data));
          localStorage.setItem(CACHE_TIME_KEY, new Date().getTime());
          renderProducts();
          checkUrlForProduct();
        } else if (!cachedData) {
          document.getElementById('product-grid').innerHTML = 
            `<div class="col-span-full text-center py-12 text-neutral-400 text-sm">Chưa có sản phẩm nào trong Sheet SanPham.</div>`;
        }
      } catch (err) {
        if (!cachedData) {
          document.getElementById('product-grid').innerHTML = 
            `<div class="col-span-full text-center py-12 text-red-400 text-sm">Không thể tải dữ liệu sản phẩm từ Google Sheet.</div>`;
        }
      }
    }

    // Hàm đọc đường dẫn URL dạng /shop/?id=DMDL để tự động bật Popup
    function checkUrlForProduct() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      if (productId && PRODUCTS.length > 0) {
        openDetailModal(productId);
      }
    }

    function renderProducts() {
      const typeVal = document.getElementById('filter-type')?.value || 'ALL';
      const regionVal = document.getElementById('filter-region')?.value || 'ALL';
      const sortVal = document.getElementById('sort-price')?.value || 'default';

      // Lọc theo Type & Region
      let filtered = PRODUCTS.filter(p => {
        const pType = normalizeStr(p.type);
        const pRegion = normalizeStr(p.region);

        const matchType = (typeVal === 'ALL') || pType.includes(normalizeStr(typeVal));
        const matchRegion = (regionVal === 'ALL') || pRegion.includes(normalizeStr(regionVal));

        return matchType && matchRegion;
      });

      // Sắp xếp theo giá
      if (sortVal === 'low-to-high') {
        filtered.sort((a, b) => Number(a.price) - Number(b.price));
      } else if (sortVal === 'high-to-low') {
        filtered.sort((a, b) => Number(b.price) - Number(a.price));
      }

      const grid = document.getElementById('product-grid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-neutral-400 text-sm">No products found matching your filter.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white border border-neutral-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="relative">
              <img src="${p.img1}" alt="${p.name}" class="w-full aspect-square object-cover bg-neutral-100">
              <span class="absolute top-2 left-2 bg-neutral-900/80 text-white text-[10px] font-medium px-2 py-0.5 rounded backdrop-blur-sm">${p.type} • ${p.region}</span>
            </div>
            <div class="p-4">
              <h3 class="text-sm font-bold text-neutral-900 line-clamp-1">${p.name}</h3>
              <p class="text-xs text-neutral-500 mt-1 line-clamp-2 h-8">${p.shortDesc || ''}</p>
              
              <div class="mt-3 flex items-center justify-between">
                <span class="text-sm font-bold text-amber-700">${Number(p.price).toLocaleString('vi-VN')}đ</span>
                <span class="text-[11px] bg-neutral-100 text-neutral-600 px-2 py-0.5 rounded border border-neutral-200">${p.weight}</span>
              </div>
            </div>
          </div>

          <div class="p-4 pt-0 grid grid-cols-2 gap-2">
            <button onclick="openDetailModal('${p.id}')" class="w-full bg-neutral-100 text-neutral-800 text-xs font-semibold py-2.5 rounded-lg hover:bg-neutral-200 transition">
              See more
            </button>
            <button onclick="openOptionModal('${p.id}')" class="w-full bg-neutral-900 text-white text-xs font-semibold py-2.5 rounded-lg hover:bg-amber-700 transition">
              Buy this coffee
            </button>
          </div>
        </div>
      `).join('');
    }

    function openDetailModal(productId) {
      const p = PRODUCTS.find(item => String(item.id).trim() === String(productId).trim());
      if (!p) return;

      const imgList = [p.img1, p.img2, p.img3].filter(img => img && img.trim() !== "");
      const mainImg = imgList.length > 0 ? imgList[0] : "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=500&auto=format&fit=crop&q=80";

      document.getElementById('detail-main-img').src = mainImg;
      document.getElementById('detail-tag').innerText = `${p.type} • ${p.region}`;
      document.getElementById('detail-name').innerText = p.name;
      document.getElementById('detail-price').innerText = Number(p.price).toLocaleString('vi-VN') + 'đ';
      document.getElementById('detail-weight').innerText = `Net Weight: ${p.weight}`;
      document.getElementById('detail-longdesc').innerText = p.longDesc || p.shortDesc || '';

      const thumbContainer = document.getElementById('detail-thumbnails');
      if (imgList.length > 1) {
        thumbContainer.innerHTML = imgList.map((imgUrl) => `
          <img src="${imgUrl}" onclick="changeMainImage('${imgUrl}')" class="w-full aspect-square object-cover rounded-lg border-2 border-neutral-200 cursor-pointer hover:border-amber-700 hover:opacity-100 opacity-80 transition shadow-sm">
        `).join('');
        thumbContainer.classList.remove('hidden');
      } else {
        thumbContainer.innerHTML = "";
        thumbContainer.classList.add('hidden');
      }

      document.getElementById('detail-buy-btn').onclick = function() {
        closeDetailModal();
        openOptionModal(p.id);
      };

      document.getElementById('detail-modal').classList.remove('hidden');
    }

    function changeMainImage(url) {
      document.getElementById('detail-main-img').src = url;
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function openOptionModal(productId) {
      activeProductForPop = PRODUCTS.find(p => String(p.id).trim() === String(productId).trim());
      if (!activeProductForPop) return;

      selectedPopGrind = GRIND_OPTIONS[0];
      selectedPopQty = 1;

      document.getElementById('pop-img').src = activeProductForPop.img1;
      document.getElementById('pop-name').innerText = activeProductForPop.name;
      document.getElementById('pop-price').innerText = Number(activeProductForPop.price).toLocaleString('vi-VN') + 'đ';
      document.getElementById('pop-weight').innerText = activeProductForPop.weight;
      document.getElementById('pop-qty').innerText = selectedPopQty;

      document.getElementById('pop-grind-options').innerHTML = GRIND_OPTIONS.map(g => `
        <button type="button" onclick="selectPopGrind('${g}')" class="pop-grind-btn text-[11px] px-3 py-2 rounded border border-neutral-200 bg-neutral-100 text-neutral-700 hover:border-neutral-900 transition ${g === selectedPopGrind ? 'active' : ''}">
          ${g}
        </button>
      `).join('');

      document.getElementById('option-modal').classList.remove('hidden');
    }

    function closeOptionModal() { 
      document.getElementById('option-modal').classList.add('hidden'); 
    }

    function selectPopGrind(grind) {
      selectedPopGrind = grind;
      document.querySelectorAll('.pop-grind-btn').forEach(b => {
        if (b.innerText.trim() === grind) b.classList.add('active');
        else b.classList.remove('active');
      });
    }

    function changePopQty(delta) {
      selectedPopQty = Math.max(1, selectedPopQty + delta);
      document.getElementById('pop-qty').innerText = selectedPopQty;
    }

    function confirmAddToCart() {
      if (!activeProductForPop) return;
      const cartKey = `${activeProductForPop.id}-${selectedPopGrind}`;
      const existingIndex = cart.findIndex(item => item.key === cartKey);

      if (existingIndex > -1) cart[existingIndex].qty += selectedPopQty;
      else {
        cart.push({
          key: cartKey,
          id: activeProductForPop.id,
          name: activeProductForPop.name,
          grind: selectedPopGrind,
          price: Number(activeProductForPop.price),
          qty: selectedPopQty
        });
      }

      saveCart();
      closeOptionModal();
      toggleCart(true);
    }

    function updateQty(key, delta) {
      const index = cart.findIndex(item => item.key === key);
      if (index > -1) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) cart.splice(index, 1);
      }
      saveCart();
    }

    function saveCart() {
      localStorage.setItem('oriberry_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);

      const container = document.getElementById('cart-items-container');
      if (cart.length === 0) {
        container.innerHTML = `<p class="text-xs text-neutral-400 text-center py-8">Your cart is empty.</p>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between border-b border-neutral-100 pb-3">
            <div>
              <h4 class="text-xs font-bold text-neutral-900">${item.name}</h4>
              <p class="text-[11px] text-neutral-500">Grind: ${item.grind}</p>
              <p class="text-xs font-medium text-amber-700 mt-0.5">${(item.price * item.qty).toLocaleString('vi-VN')}đ</p>
            </div>
            <div class="flex items-center border border-neutral-300 rounded">
              <button onclick="updateQty('${item.key}', -1)" class="px-2 py-0.5 text-xs text-neutral-600 hover:bg-neutral-100">-</button>
              <span class="px-2 text-xs font-bold">${item.qty}</span>
              <button onclick="updateQty('${item.key}', 1)" class="px-2 py-0.5 text-xs text-neutral-600 hover:bg-neutral-100">+</button>
            </div>
          </div>
        `).join('');
      }

updateCartTotals();
function updateCartTotals() {
  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  
  const zoneSelect = document.getElementById('shipping-zone');
  const selectedZone = zoneSelect ? zoneSelect.value : 'within2km';

  const MOC_2_FREESHIP_HN = 1000000;
  const MOC_3_DISCOUNT = 2000000;
  const DISCOUNT_RATE = 0.05;

  let discount = 0;
  let shipFee = 0;
  let promoText = "";

  if (subtotal >= MOC_3_DISCOUNT) {
    discount = subtotal * DISCOUNT_RATE;
  }

  if (selectedZone === 'within2km') {
    shipFee = 0;
  } else if (selectedZone === 'hanoi_inner') {
    if (subtotal >= MOC_2_FREESHIP_HN) {
      shipFee = 0;
    } else {
      shipFee = 25000;
    }
  } else if (selectedZone === 'hanoi_outer') {
    shipFee = 35000;
  } else if (selectedZone === 'provinces') {
    shipFee = 45000;
  }

  if (subtotal >= MOC_3_DISCOUNT) {
    promoText = "🎉 <b>Congrats!</b> You unlocked <b>5% OFF</b> + Inner Hanoi Free Shipping!";
  } else if (subtotal >= MOC_2_FREESHIP_HN) {
    const needForDiscount = MOC_3_DISCOUNT - subtotal;
    promoText = `🚚 Inner Hanoi <b>FREE Shipping</b> applied! Add <b>${needForDiscount.toLocaleString('vi-VN')}đ</b> more for <b>5% OFF</b>.`;
  } else {
    const needForFreeShip = MOC_2_FREESHIP_HN - subtotal;
    promoText = `💡 Add <b>${needForFreeShip.toLocaleString('vi-VN')}đ</b> more to get FREE Shipping in Inner Hanoi!`;
  }

  const grandTotal = subtotal - discount + shipFee;

  const promoBanner = document.getElementById('shipping-promo-banner');
  if (promoBanner) promoBanner.innerHTML = promoText;

  if (document.getElementById('cart-subtotal')) document.getElementById('cart-subtotal').textContent = subtotal.toLocaleString('vi-VN') + 'đ';
  if (document.getElementById('cart-discount')) document.getElementById('cart-discount').textContent = discount > 0 ? '-' + discount.toLocaleString('vi-VN') + 'đ' : '0đ';
  if (document.getElementById('cart-shipping')) document.getElementById('cart-shipping').textContent = shipFee === 0 ? 'FREE' : shipFee.toLocaleString('vi-VN') + 'đ';
  if (document.getElementById('cart-total-price')) document.getElementById('cart-total-price').textContent = grandTotal.toLocaleString('vi-VN') + 'đ';
}
    
    function openCart() {
      updateCartTotals();
      toggleCart(true);
    }

    function toggleCart(open = null) {
      const modal = document.getElementById('cart-modal');
      if (open === true) modal.classList.remove('hidden');
      else if (open === false) modal.classList.add('hidden');
      else modal.classList.toggle('hidden');
    }

    async function submitOrder(e) {
      e.preventDefault();
      if (cart.length === 0) return alert("Your cart is empty!");

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting order...";

const name = document.getElementById('cust-name').value;
const phone = document.getElementById('cust-phone').value;
const address = document.getElementById('cust-address').value;
const note = document.getElementById('cust-note') ? document.getElementById('cust-note').value : '';

const itemsDetail = cart.map(i => `${i.name} (${i.grind}) x${i.qty}`).join(' | ');

const subtotalVal = document.getElementById('cart-subtotal') ? document.getElementById('cart-subtotal').textContent : '';
const discountVal = document.getElementById('cart-discount') ? document.getElementById('cart-discount').textContent : '0đ';
const shippingVal = document.getElementById('cart-shipping') ? document.getElementById('cart-shipping').textContent : '0đ';
const totalVal = document.getElementById('cart-total-price') ? document.getElementById('cart-total-price').textContent : '';

const payload = { 
  customerName: name, 
  phone: phone, 
  address: address, 
  note: note, 
  itemsDetail: itemsDetail, 
  subtotal: subtotalVal,
  discount: discountVal,
  shippingFee: shippingVal,
  totalAmount: totalVal 
};
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

// Thay cho dòng alert() ở dòng 509
const successModal = document.createElement('div');
successModal.className = 'fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4';
successModal.innerHTML = `
  <div class="bg-white rounded-lg p-6 max-w-sm w-full text-center shadow-xl">
    <div class="text-3xl mb-2">🎉</div>
    <h3 class="text-lg font-bold text-stone-900 mb-1">Success!</h3>
    <p class="text-sm text-stone-600 mb-5">Order placed successfully! Your order has been saved.</p>
    <button id="close-success-btn" class="w-full bg-stone-900 text-white font-medium py-2.5 rounded text-sm hover:bg-stone-800 transition-colors uppercase tracking-wider">
      OK
    </button>
  </div>
`;
document.body.appendChild(successModal);
document.getElementById('close-success-btn').onclick = () => { successModal.remove(); };
        cart = [];
        saveCart();
        toggleCart(false);
        document.getElementById('checkout-form').reset();
      } catch (err) {
        alert("An error occurred while sending your order. Please try again!");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Place Order";
      }
    }

    // Khởi tạo trang
    fetchProducts();
    updateCartUI();
  </script>
