<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa hàng Oriberry Coffee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .grind-btn.active {
      background-color: #171717;
      color: #ffffff;
      border-color: #171717;
    }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header / Navigation -->
  <header class="sticky top-0 bg-white border-b border-neutral-200 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="text-xl font-bold tracking-wider text-neutral-900">ORIBERRY</a>
      <div class="flex items-center gap-6">
        <a href="/" class="text-sm font-medium text-neutral-600 hover:text-neutral-900">Trang chủ</a>
        <button id="cart-btn" onclick="toggleCart()" class="relative bg-neutral-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-neutral-800 flex items-center gap-2">
          <span>Giỏ hàng</span>
          <span id="cart-count" class="bg-amber-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-8 w-full flex-grow">
    
    <!-- Tiêu đề & Bộ lọc sản phẩm -->
    <div class="mb-8 bg-white p-5 rounded-xl border border-neutral-200 shadow-sm space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-neutral-100 pb-4">
        <div>
          <h1 class="text-2xl font-bold text-neutral-900">Cửa Hàng Cà Phê</h1>
          <p class="text-xs text-neutral-500 mt-1">Khám phá các sản phẩm cà phê hạt rang chất lượng cao từ Oriberry</p>
        </div>
        
        <!-- Sắp xếp giá -->
        <div class="flex items-center gap-2">
          <label class="text-xs font-semibold text-neutral-600 whitespace-nowrap">Sắp xếp giá:</label>
          <select id="sort-price" onchange="applyFilters()" class="text-xs border border-neutral-300 rounded-lg p-2 bg-white focus:outline-none focus:ring-1 focus:ring-neutral-900">
            <option value="default">Mặc định</option>
            <option value="asc">Giá: Thấp đến Cao</option>
            <option value="desc">Giá: Cao đến Thấp</option>
          </select>
        </div>
      </div>

      <!-- Các thẻ lọc (Tags filter) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
        <!-- Lọc theo Giống/Loại Cà phê -->
        <div>
          <span class="block font-bold text-neutral-700 mb-2">Loại cà phê:</span>
          <div class="flex flex-wrap gap-1.5" id="type-filter-tags">
            <button onclick="filterType('ALL')" class="type-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-900 text-white font-medium">Tất cả</button>
            <button onclick="filterType('Arabica')" class="type-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Arabica</button>
            <button onclick="filterType('Robusta')" class="type-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Robusta</button>
            <button onclick="filterType('Liberica')" class="type-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Liberica/Excelsa</button>
            <button onclick="filterType('Blended')" class="type-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Blended</button>
          </div>
        </div>

        <!-- Lọc theo Vùng trồng -->
        <div>
          <span class="block font-bold text-neutral-700 mb-2">Vùng trồng:</span>
          <div class="flex flex-wrap gap-1.5" id="region-filter-tags">
            <button onclick="filterRegion('ALL')" class="region-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-900 text-white font-medium">Tất cả</button>
            <button onclick="filterRegion('Quảng Trị')" class="region-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Quảng Trị</button>
            <button onclick="filterRegion('Điện Biên')" class="region-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Điện Biên</button>
            <button onclick="filterRegion('Lâm Đồng')" class="region-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Lâm Đồng</button>
            <button onclick="filterRegion('Đắk Lắk')" class="region-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Đắk Lắk</button>
            <button onclick="filterRegion('Gia Lai')" class="region-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200">Gia Lai</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Product Grid 3x3 -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Products render dynamically from JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-200 py-8 text-center text-xs text-neutral-500 bg-white">
    <p>© 2026 Oriberry Coffee. Minimalist Jamstack Store.</p>
  </footer>

  <!-- POPUP CHỌN TÙY CHỌN SẢN PHẨM (SHOPEE STYLE POPUP) -->
  <div id="option-modal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="fixed inset-0 bg-black/60 transition-opacity" onclick="closeOptionModal()"></div>
    
    <div class="relative w-full max-w-md bg-white rounded-t-2xl sm:rounded-xl shadow-2xl overflow-hidden z-10 p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <button onclick="closeOptionModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-neutral-800 text-2xl font-bold">&times;</button>
      
      <!-- Thông tin sản phẩm trong Pop-up -->
      <div class="flex gap-4 items-start border-b border-neutral-100 pb-4">
        <img id="pop-img" src="" class="w-20 h-20 object-cover rounded-lg bg-neutral-100">
        <div>
          <h3 id="pop-name" class="font-bold text-sm text-neutral-900"></h3>
          <p id="pop-price" class="text-base font-bold text-amber-700 mt-1"></p>
          <span id="pop-stock" class="text-xs text-neutral-400">Kho: 999</span>
        </div>
      </div>

      <!-- Tùy chọn cỡ xay (Nuts/Powder Type) -->
      <div>
        <label class="block text-xs font-bold text-neutral-800 mb-2">Chọn cỡ xay (Nuts/Powder Type):</label>
        <div class="flex flex-wrap gap-2" id="pop-grind-options">
          <!-- Grind buttons injected via JS -->
        </div>
      </div>

      <!-- Quy cách đóng gói (Volume / Weight) -->
      <div>
        <label class="block text-xs font-bold text-neutral-800 mb-1">Khối lượng (Volume):</label>
        <span id="pop-weight" class="inline-block bg-neutral-100 text-neutral-800 border border-neutral-300 px-3 py-1 rounded text-xs font-medium"></span>
      </div>

      <!-- Số lượng (Quantity) -->
      <div class="flex items-center justify-between pt-2 border-t border-neutral-100">
        <span class="text-xs font-bold text-neutral-800">Số lượng (Quantity):</span>
        <div class="flex items-center border border-neutral-300 rounded">
          <button onclick="changePopQty(-1)" class="px-3 py-1 text-sm font-bold text-neutral-600 hover:bg-neutral-100">-</button>
          <span id="pop-qty" class="px-4 text-xs font-bold">1</span>
          <button onclick="changePopQty(1)" class="px-3 py-1 text-sm font-bold text-neutral-600 hover:bg-neutral-100">+</button>
        </div>
      </div>

      <!-- Nút xác nhận thêm vào giỏ -->
      <button id="pop-add-btn" onclick="confirmAddToCart()" class="w-full bg-amber-700 text-white font-bold text-xs py-3.5 rounded-lg hover:bg-amber-800 transition">
        Thêm vào giỏ hàng
      </button>
    </div>
  </div>

  <!-- Slide-over Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-black/50 transition-opacity" onclick="toggleCart()"></div>

    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
      <div class="w-screen max-w-md bg-white shadow-xl flex flex-col justify-between p-6">
        <div>
          <div class="flex items-center justify-between pb-4 border-b border-neutral-200">
            <h3 class="text-lg font-bold text-neutral-900">Giỏ hàng của bạn</h3>
            <button onclick="toggleCart()" class="text-neutral-500 hover:text-neutral-800 text-xl font-bold">&times;</button>
          </div>

          <div id="cart-items-container" class="py-4 space-y-4 max-h-[50vh] overflow-y-auto">
            <!-- Items rendered via JS -->
          </div>
        </div>

        <div class="border-t border-neutral-200 pt-4">
          <div class="flex justify-between items-center text-base font-bold text-neutral-900 mb-4">
            <span>Tổng tiền:</span>
            <span id="cart-total-price">0đ</span>
          </div>

          <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-3">
            <input type="text" id="cust-name" placeholder="Họ và tên *" required class="w-full text-xs border border-neutral-300 rounded-md p-2.5 focus:outline-none focus:ring-1 focus:ring-neutral-900">
            <input type="tel" id="cust-phone" placeholder="Số điện thoại *" required class="w-full text-xs border border-neutral-300 rounded-md p-2.5 focus:outline-none focus:ring-1 focus:ring-neutral-900">
            <textarea id="cust-address" placeholder="Địa chỉ nhận hàng *" rows="2" required class="w-full text-xs border border-neutral-300 rounded-md p-2.5 focus:outline-none focus:ring-1 focus:ring-neutral-900"></textarea>
            
            <button type="submit" id="submit-btn" class="w-full bg-amber-700 text-white font-medium text-sm py-3 rounded-lg hover:bg-amber-800 transition">
              Xác nhận Đặt hàng
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Store Logic Script -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWopdIwcIH1mI6i0LNZP3YLK_U7zjIc6iMwLEdyCNuZ4L4jAwop8QWc6g0v06Qs_f/exec";

    const GRIND_OPTIONS = [
      "Whole grain",
      "Drip/V60 powder",
      "Coldbrew powder",
      "Espresso powder",
      "Staresso powder",
      "Aeropress powder",
      "Frenchpress Powder/Phin",
      "Moka powder"
    ];

    // Dữ liệu sản phẩm mẫu bao gồm Loại (type) & Vùng trồng (region)
    const PRODUCTS = [
      {
        id: "muong-phang",
        name: "Muong Phang Shade-Grown Coffee",
        description: "Roasted Arabica coffee Muong Phang, Dien Bien cultivated under forest canopy",
        price: 127600,
        weight: "200g",
        type: "Arabica",
        region: "Điện Biên",
        img: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=500&auto=format&fit=crop&q=80"
      },
      {
        id: "khe-sanh-honey",
        name: "Arabica Quảng Trị - Honey Process",
        description: "Hương hoa quả mọng, chua thanh hậu vị ngọt sâu",
        price: 180000,
        weight: "250g",
        type: "Arabica",
        region: "Quảng Trị",
        img: "https://images.unsplash.com/photo-1587734195503-904fca47e0e9?w=500&auto=format&fit=crop&q=80"
      },
      {
        id: "robusta-daklak",
        name: "Fine Robusta Đắk Lắk",
        description: "Đậm đà, thơm vị sô-cô-la đen & hạt dẻ rang",
        price: 140000,
        weight: "250g",
        type: "Robusta",
        region: "Đắk Lắk",
        img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=80"
      },
      {
        id: "blend-house",
        name: "Oriberry House Blend",
        description: "Sự kết hợp hoàn hảo giữa Arabica & Robusta",
        price: 155000,
        weight: "250g",
        type: "Blended",
        region: "Lâm Đồng",
        img: "https://images.unsplash.com/photo-1511920170033-f8396924c348?w=500&auto=format&fit=crop&q=80"
      },
      {
        id: "liberica-gialai",
        name: "Specialty Liberica Gia Lai",
        description: "Hương vị trái cây chín lên men đặc trưng, vị đậm độc đáo",
        price: 210000,
        weight: "200g",
        type: "Liberica",
        region: "Gia Lai",
        img: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?w=500&auto=format&fit=crop&q=80"
      }
    ];

    let currentTypeFilter = 'ALL';
    let currentRegionFilter = 'ALL';
    let activeProductForPop = null;
    let selectedPopGrind = GRIND_OPTIONS[0];
    let selectedPopQty = 1;

    let cart = JSON.parse(localStorage.getItem('oriberry_cart') || '[]');

    function renderProducts() {
      let filtered = PRODUCTS.filter(p => {
        const matchType = (currentTypeFilter === 'ALL') || (p.type === currentTypeFilter);
        const matchRegion = (currentRegionFilter === 'ALL') || (p.region === currentRegionFilter);
        return matchType && matchRegion;
      });

      // Sort by price
      const sortVal = document.getElementById('sort-price').value;
      if (sortVal === 'asc') {
        filtered.sort((a, b) => a.price - b.price);
      } else if (sortVal === 'desc') {
        filtered.sort((a, b) => b.price - a.price);
      }

      const grid = document.getElementById('product-grid');
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-neutral-400 text-sm">Không tìm thấy sản phẩm phù hợp.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white border border-neutral-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="relative">
              <img src="${p.img}" alt="${p.name}" class="w-full aspect-square object-cover bg-neutral-100">
              <span class="absolute top-2 left-2 bg-neutral-900/80 text-white text-[10px] font-medium px-2 py-0.5 rounded backdrop-blur-sm">${p.type} • ${p.region}</span>
            </div>
            <div class="p-4">
              <h3 class="text-sm font-bold text-neutral-900 line-clamp-1">${p.name}</h3>
              <p class="text-xs text-neutral-500 mt-1 line-clamp-2 h-8">${p.description}</p>
              <div class="mt-3 flex items-center justify-between">
                <span class="text-sm font-bold text-amber-700">${p.price.toLocaleString('vi-VN')}đ</span>
                <span class="text-[11px] bg-neutral-100 text-neutral-600 px-2 py-0.5 rounded border border-neutral-200">${p.weight}</span>
              </div>
            </div>
          </div>

          <div class="p-4 pt-0">
            <button onclick="openOptionModal('${p.id}')" class="w-full bg-neutral-900 text-white text-xs font-medium py-2.5 rounded-lg hover:bg-amber-700 transition flex items-center justify-center gap-1">
              <span>Thêm vào giỏ hàng</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    function filterType(type) {
      currentTypeFilter = type;
      // Update UI active tag
      const btns = document.querySelectorAll('#type-filter-tags button');
      btns.forEach(b => {
        if ((type === 'ALL' && b.innerText.includes('Tất cả')) || b.innerText.includes(type)) {
          b.className = "type-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-900 text-white font-medium";
        } else {
          b.className = "type-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200";
        }
      });
      renderProducts();
    }

    function filterRegion(region) {
      currentRegionFilter = region;
      // Update UI active tag
      const btns = document.querySelectorAll('#region-filter-tags button');
      btns.forEach(b => {
        if ((region === 'ALL' && b.innerText.includes('Tất cả')) || b.innerText.includes(region)) {
          b.className = "region-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-900 text-white font-medium";
        } else {
          b.className = "region-tag text-xs px-3 py-1 rounded-full border border-neutral-300 bg-neutral-100 text-neutral-700 hover:bg-neutral-200";
        }
      });
      renderProducts();
    }

    function applyFilters() {
      renderProducts();
    }

    /* Pop-up Shopee logic */
    function openOptionModal(productId) {
      activeProductForPop = PRODUCTS.find(p => p.id === productId);
      selectedPopGrind = GRIND_OPTIONS[0];
      selectedPopQty = 1;

      document.getElementById('pop-img').src = activeProductForPop.img;
      document.getElementById('pop-name').innerText = activeProductForPop.name;
      document.getElementById('pop-price').innerText = activeProductForPop.price.toLocaleString('vi-VN') + 'đ';
      document.getElementById('pop-weight').innerText = activeProductForPop.weight;
      document.getElementById('pop-qty').innerText = selectedPopQty;

      // Render grind buttons inside popup
      const grindContainer = document.getElementById('pop-grind-options');
      grindContainer.innerHTML = GRIND_OPTIONS.map(g => `
        <button 
          type="button" 
          onclick="selectPopGrind('${g}')"
          class="pop-grind-btn text-[11px] px-3 py-2 rounded border border-neutral-200 bg-neutral-100 text-neutral-700 hover:border-neutral-900 transition ${g === selectedPopGrind ? 'active' : ''}"
        >
          ${g}
        </button>
      `).join('');

      document.getElementById('option-modal').classList.remove('hidden');
    }

    function closeOptionModal() {
      document.getElementById('option-modal').classList.add('hidden');
    }

    function selectPopGrind(grind) {
      selectedPopGrind = grind;
      const btns = document.querySelectorAll('.pop-grind-btn');
      btns.forEach(b => {
        if (b.innerText.trim() === grind) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
    }

    function changePopQty(delta) {
      selectedPopQty = Math.max(1, selectedPopQty + delta);
      document.getElementById('pop-qty').innerText = selectedPopQty;
    }

    function confirmAddToCart() {
      if (!activeProductForPop) return;

      const cartKey = `${activeProductForPop.id}-${selectedPopGrind}`;
      const existingIndex = cart.findIndex(item => item.key === cartKey);

      if (existingIndex > -1) {
        cart[existingIndex].qty += selectedPopQty;
      } else {
        cart.push({
          key: cartKey,
          id: activeProductForPop.id,
          name: activeProductForPop.name,
          grind: selectedPopGrind,
          price: activeProductForPop.price,
          qty: selectedPopQty
        });
      }

      saveCart();
      closeOptionModal();
      toggleCart(true);
    }

    /* Giỏ hàng Logic */
    function updateQty(key, delta) {
      const index = cart.findIndex(item => item.key === key);
      if (index > -1) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) cart.splice(index, 1);
      }
      saveCart();
    }

    function saveCart() {
      localStorage.setItem('oriberry_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').innerText = totalQty;

      const container = document.getElementById('cart-items-container');
      if (cart.length === 0) {
        container.innerHTML = `<p class="text-xs text-neutral-400 text-center py-8">Giỏ hàng của bạn đang trống.</p>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between border-b border-neutral-100 pb-3">
            <div>
              <h4 class="text-xs font-bold text-neutral-900">${item.name}</h4>
              <p class="text-[11px] text-neutral-500">Xay: ${item.grind}</p>
              <p class="text-xs font-medium text-amber-700 mt-0.5">${(item.price * item.qty).toLocaleString('vi-VN')}đ</p>
            </div>
            <div class="flex items-center border border-neutral-300 rounded">
              <button onclick="updateQty('${item.key}', -1)" class="px-2 py-0.5 text-xs text-neutral-600 hover:bg-neutral-100">-</button>
              <span class="px-2 text-xs font-bold">${item.qty}</span>
              <button onclick="updateQty('${item.key}', 1)" class="px-2 py-0.5 text-xs text-neutral-600 hover:bg-neutral-100">+</button>
            </div>
          </div>
        `).join('');
      }

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cart-total-price').innerText = totalPrice.toLocaleString('vi-VN') + 'đ';
    }

    function toggleCart(open = null) {
      const modal = document.getElementById('cart-modal');
      if (open === true) modal.classList.remove('hidden');
      else if (open === false) modal.classList.add('hidden');
      else modal.classList.toggle('hidden');
    }

    async function submitOrder(e) {
      e.preventDefault();
      if (cart.length === 0) {
        alert("Giỏ hàng của bạn đang trống!");
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Đang gửi đơn hàng...";

      const itemsDetail = cart.map(i => `${i.name} [Xay: ${i.grind}] x${i.qty}`).join(' | ');
      const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const payload = {
        customerName: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        address: document.getElementById('cust-address').value,
        itemsDetail: itemsDetail,
        totalAmount: totalAmount.toLocaleString('vi-VN') + 'đ'
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("🎉 Đặt hàng thành công! Oriberry sẽ liên hệ xác nhận sớm nhất.");
        cart = [];
        saveCart();
        toggleCart(false);
        document.getElementById('checkout-form').reset();
      } catch (err) {
        alert("Có lỗi xảy ra khi gửi đơn hàng. Vui lòng thử lại!");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Xác nhận Đặt hàng";
      }
    }

    // Init
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
