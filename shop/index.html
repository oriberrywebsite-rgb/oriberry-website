<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa hàng Oriberry Coffee</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-50 text-neutral-800 font-sans">
  <!-- Header -->
  <header class="sticky top-0 bg-white border-b border-neutral-200 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="text-xl font-bold tracking-wider text-neutral-900">ORIBERRY</a>
      <div class="flex items-center gap-6">
        <a href="/" class="text-sm font-medium hover:text-amber-700">Trang chủ</a>
        <button class="relative bg-neutral-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-neutral-800">
          Giỏ hàng
          <span class="absolute -top-2 -right-2 bg-amber-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Banner -->
  <section class="bg-neutral-900 text-white py-12 px-4 text-center">
    <h1 class="text-3xl font-light tracking-wide mb-2">CÀ PHÊ HẠT RANG MỚI</h1>
    <p class="text-neutral-400 text-sm max-w-md mx-auto">Tuyển chọn các dòng Arabica & Specialty đậm đà bản sắc vùng trồng.</p>
  </section>

  <!-- Main Product Grid -->
  <main class="max-w-6xl mx-auto px-4 py-12">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      
      <!-- Product Card 1 -->
      <div class="bg-white border border-neutral-200 rounded-xl overflow-hidden hover:shadow-lg transition">
        <div class="aspect-square bg-neutral-100 flex items-center justify-center text-neutral-400">
          [Ảnh 1: Arabica Quảng Trị]
        </div>
        <div class="p-5">
          <span class="text-xs font-semibold text-amber-700 uppercase tracking-wider">Specialty</span>
          <h3 class="text-lg font-bold mt-1 text-neutral-900">Arabica Quảng Trị</h3>
          <p class="text-xs text-neutral-500 mt-1">Sơ chế Thô / Mật ong • Độ cao 800m</p>
          <div class="mt-4 flex items-center justify-between">
            <span class="text-base font-bold text-neutral-900">180.000đ <span class="text-xs font-normal text-neutral-500">/ 250g</span></span>
            <button class="bg-neutral-900 text-white text-xs px-3 py-2 rounded-md hover:bg-amber-700 transition">
              + Thêm vào giỏ
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
