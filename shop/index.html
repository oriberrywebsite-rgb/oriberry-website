<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa hàng Oriberry Coffee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .grind-btn.active {
      background-color: #171717;
      color: #ffffff;
      border-color: #171717;
    }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- Header / Navigation -->
  <header class="sticky top-0 bg-white border-b border-neutral-200 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="text-xl font-bold tracking-wider text-neutral-900">ORIBERRY</a>
      <div class="flex items-center gap-6">
        <a href="/" class="text-sm font-medium text-neutral-600 hover:text-neutral-900">Trang chủ</a>
        <button id="cart-btn" onclick="toggleCart()" class="relative bg-neutral-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-neutral-800 flex items-center gap-2">
          <span>Giỏ hàng</span>
          <span id="cart-count" class="bg-amber-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="bg-neutral-900 text-white py-12 px-4 text-center">
    <span class="text-xs font-semibold text-amber-500 uppercase tracking-widest">Specialty Coffee</span>
    <h1 class="text-3xl md:text-4xl font-light tracking-wide my-2">CÀ PHÊ HẠT RANG MỚI</h1>
    <p class="text-neutral-400 text-sm max-w-md mx-auto">Tuyển chọn các dòng Arabica & Specialty đậm đà bản sắc vùng trồng.</p>
  </section>

  <!-- Product List Grid -->
  <main class="max-w-6xl mx-auto px-4 py-12 w-full">
    <h2 class="text-xl font-bold text-neutral-900 mb-6">Sản phẩm cà phê</h2>
    <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Products render dynamically from JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-200 py-8 text-center text-xs text-neutral-500">
    <p>© 2026 Oriberry Coffee. Minimalist Jamstack Store.</p>
  </footer>

  <!-- Slide-over Cart Modal -->
  <div id="cart-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-black/50 transition-opacity" onclick="toggleCart()"></div>

    <div class="fixed inset-y-0 right-0 max-w-full flex pl-10">
      <div class="w-screen max-w-md bg-white shadow-xl flex flex-col justify-between p-6">
        
        <div>
          <div class="flex items-center justify-between pb-4 border-b border-neutral-200">
            <h3 class="text-lg font-bold text-neutral-900">Giỏ hàng của bạn</h3>
            <button onclick="toggleCart()" class="text-neutral-500 hover:text-neutral-800 text-xl font-bold">&times;</button>
          </div>

          <div id="cart-items-container" class="py-4 space-y-4 max-h-[50vh] overflow-y-auto">
            <!-- Items rendered via JS -->
          </div>
        </div>

        <div class="border-t border-neutral-200 pt-4">
          <div class="flex justify-between items-center text-base font-bold text-neutral-900 mb-4">
            <span>Tổng tiền:</span>
            <span id="cart-total-price">0đ</span>
          </div>

          <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-3">
            <input type="text" id="cust-name" placeholder="Họ và tên *" required class="w-full text-xs border border-neutral-300 rounded-md p-2.5 focus:outline-none focus:ring-1 focus:ring-neutral-900">
            <input type="tel" id="cust-phone" placeholder="Số điện thoại *" required class="w-full text-xs border border-neutral-300 rounded-md p-2.5 focus:outline-none focus:ring-1 focus:ring-neutral-900">
            <textarea id="cust-address" placeholder="Địa chỉ nhận hàng *" rows="2" required class="w-full text-xs border border-neutral-300 rounded-md p-2.5 focus:outline-none focus:ring-1 focus:ring-neutral-900"></textarea>
            
            <button type="submit" id="submit-btn" class="w-full bg-amber-700 text-white font-medium text-sm py-3 rounded-lg hover:bg-amber-800 transition">
              Xác nhận Đặt hàng
            </button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- Store Logic Script -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWopdIwcIH1mI6i0LNZP3YLK_U7zjIc6iMwLEdyCNuZ4L4jAwop8QWc6g0v06Qs_f/exec";

    const GRIND_OPTIONS = [
      { id: "whole", label: "Nguyên hạt (Whole grain)" },
      { id: "drip", label: "Drip / V60 powder" },
      { id: "coldbrew", label: "Coldbrew powder" },
      { id: "espresso", label: "Espresso powder" },
      { id: "staresso", label: "Staresso powder" },
      { id: "aeropress", label: "Aeropress powder" },
      { id: "frenchpress", label: "Frenchpress / Phin" },
      { id: "moka", label: "Moka powder" }
    ];

    const PRODUCTS = [
      {
        id: "muong-phang",
        name: "Muong Phang Shade-Grown Coffee",
        origin: "Cà phê trồng dưới tán rừng Mường Phăng, Điện Biên",
        price: 127600,
        weight: "200g",
        category: "Roasted Arabica",
        img: "https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=500&auto=format&fit=crop&q=80"
      },
      {
        id: "arabica-quang-tri",
        name: "Arabica Quảng Trị - Honey Process",
        origin: "Tuyển chọn độ cao 800m • Khe Sanh, Quảng Trị",
        price: 180000,
        weight: "250g",
        category: "Specialty Coffee",
        img: "https://images.unsplash.com/photo-1587734195503-904fca47e0e9?w=500&auto=format&fit=crop&q=80"
      }
    ];

    // Track selected grind per product
    const selectedGrinds = {};
    const productQuantities = {};

    let cart = JSON.parse(localStorage.getItem('oriberry_cart') || '[]');

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = PRODUCTS.map(p => {
        // Default values
        if (!selectedGrinds[p.id]) selectedGrinds[p.id] = GRIND_OPTIONS[0].label;
        if (!productQuantities[p.id]) productQuantities[p.id] = 1;

        return `
          <div class="bg-white border border-neutral-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <img src="${p.img}" alt="${p.name}" class="w-full aspect-square object-cover bg-neutral-100">
              <div class="p-5">
                <span class="text-xs font-semibold text-amber-700 uppercase tracking-wider">${p.category}</span>
                <h3 class="text-lg font-bold mt-1 text-neutral-900">${p.name}</h3>
                <p class="text-xs text-neutral-500 mt-1">${p.origin}</p>
                
                <!-- Grind Type Selection (Shopee Style Buttons) -->
                <div class="mt-4">
                  <label class="block text-xs font-bold text-neutral-700 mb-2">Chọn cỡ xay (Type):</label>
                  <div class="flex flex-wrap gap-1.5">
                    ${GRIND_OPTIONS.map(g => `
                      <button 
                        type="button" 
                        onclick="selectGrind('${p.id}', '${g.label}')"
                        id="grind-btn-${p.id}-${g.id}"
                        class="grind-btn grind-btn-${p.id} text-[11px] px-2.5 py-1.5 rounded border border-neutral-200 bg-neutral-100 text-neutral-700 hover:border-neutral-900 transition${selectedGrinds[p.id] === g.label ? 'active' : ''}"
                      >
                        ${g.label}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <!-- Volume -->
                <div class="mt-4 flex items-center justify-between text-xs">
                  <span class="font-bold text-neutral-700">Khối lượng:</span>
                  <span class="bg-neutral-100 px-3 py-1 rounded font-medium text-neutral-800 border border-neutral-200">${p.weight}</span>
                </div>
              </div>
            </div>

            <div class="p-5 pt-0 border-t border-neutral-100 mt-4">
              <div class="flex items-center justify-between mb-3 mt-3">
                <span class="text-lg font-bold text-neutral-900">${p.price.toLocaleString('vi-VN')}đ</span>
                
                <!-- Quantity selector -->
                <div class="flex items-center border border-neutral-300 rounded">
                  <button onclick="changeProductQty('${p.id}', -1)" class="px-2.5 py-1 text-xs font-bold text-neutral-600 hover:bg-neutral-100">-</button>
                  <span id="qty-val-${p.id}" class="px-3 text-xs font-bold">${productQuantities[p.id]}</span>
                  <button onclick="changeProductQty('${p.id}', 1)" class="px-2.5 py-1 text-xs font-bold text-neutral-600 hover:bg-neutral-100">+</button>
                </div>
              </div>

              <button onclick="addToCart('${p.id}')" class="w-full bg-neutral-900 text-white text-xs font-medium py-3 rounded-lg hover:bg-amber-700 transition">
                + Thêm vào giỏ hàng
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectGrind(productId, grindLabel) {
      selectedGrinds[productId] = grindLabel;
      // Refresh UI buttons for this product
      const buttons = document.querySelectorAll(`.grind-btn-${productId}`);
      buttons.forEach(btn => {
        if (btn.innerText.trim() === grindLabel) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function changeProductQty(productId, delta) {
      if (!productQuantities[productId]) productQuantities[productId] = 1;
      productQuantities[productId] = Math.max(1, productQuantities[productId] + delta);
      document.getElementById(`qty-val-${productId}`).innerText = productQuantities[productId];
    }

    function addToCart(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      const grind = selectedGrinds[productId] || GRIND_OPTIONS[0].label;
      const qty = productQuantities[productId] || 1;
      const cartKey = `${productId}-${grind}`;

      const existingIndex = cart.findIndex(item => item.key === cartKey);
      if (existingIndex > -1) {
        cart[existingIndex].qty += qty;
      } else {
        cart.push({
          key: cartKey,
          id: product.id,
          name: product.name,
          grind: grind,
          price: product.price,
          qty: qty
        });
      }

      saveCart();
      toggleCart(true);
    }

    function updateQty(key, delta) {
      const index = cart.findIndex(item => item.key === key);
      if (index > -1) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }
      }
      saveCart();
    }

    function saveCart() {
      localStorage.setItem('oriberry_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').innerText = totalQty;

      const container = document.getElementById('cart-items-container');
      if (cart.length === 0) {
        container.innerHTML = `<p class="text-xs text-neutral-400 text-center py-8">Giỏ hàng của bạn đang trống.</p>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between border-b border-neutral-100 pb-3">
            <div>
              <h4 class="text-xs font-bold text-neutral-900">${item.name}</h4>
              <p class="text-[11px] text-neutral-500">Xay: ${item.grind}</p>
              <p class="text-xs font-medium text-amber-700 mt-0.5">${(item.price * item.qty).toLocaleString('vi-VN')}đ</p>
            </div>
            <div class="flex items-center border border-neutral-300 rounded">
              <button onclick="updateQty('${item.key}', -1)" class="px-2 py-0.5 text-xs text-neutral-600 hover:bg-neutral-100">-</button>
              <span class="px-2 text-xs font-bold">${item.qty}</span>
              <button onclick="updateQty('${item.key}', 1)" class="px-2 py-0.5 text-xs text-neutral-600 hover:bg-neutral-100">+</button>
            </div>
          </div>
        `).join('');
      }

      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      document.getElementById('cart-total-price').innerText = totalPrice.toLocaleString('vi-VN') + 'đ';
    }

    function toggleCart(open = null) {
      const modal = document.getElementById('cart-modal');
      if (open === true) {
        modal.classList.remove('hidden');
      } else if (open === false) {
        modal.classList.add('hidden');
      } else {
        modal.classList.toggle('hidden');
      }
    }

    async function submitOrder(e) {
      e.preventDefault();
      if (cart.length === 0) {
        alert("Giỏ hàng của bạn đang trống!");
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Đang gửi đơn hàng...";

      const itemsDetail = cart.map(i => `${i.name} [Xay: ${i.grind}] x${i.qty}`).join(' | ');
      const totalAmount = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const payload = {
        customerName: document.getElementById('cust-name').value,
        phone: document.getElementById('cust-phone').value,
        address: document.getElementById('cust-address').value,
        itemsDetail: itemsDetail,
        totalAmount: totalAmount.toLocaleString('vi-VN') + 'đ'
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("🎉 Đặt hàng thành công! Oriberry sẽ liên hệ xác nhận sớm nhất.");
        cart = [];
        saveCart();
        toggleCart(false);
        document.getElementById('checkout-form').reset();
      } catch (err) {
        alert("Có lỗi xảy ra khi gửi đơn hàng. Vui lòng thử lại!");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Xác nhận Đặt hàng";
      }
    }

    // Init
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
